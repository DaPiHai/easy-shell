[package]
name = "easy-shell"
version = "0.1.0"
description = "A minimal SSH and SFTP client"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "easy_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 选私钥文件用的原生文件对话框
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.63.3", default-features = false, features = ["flate2", "ring", "rsa"] }
tokio = { version = "1.53.1", features = ["full"] }
base64 = "0.23.1"
# 本地 Shell 的 GBK 输出转 UTF-8。Windows 控制台默认代码页 936，
# PowerShell / cmd 输出的中文不是 UTF-8，xterm 按 UTF-8 解码会全乱码
encoding_rs = "0.8"
uuid = { version = "1.20.0", features = ["v4"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
argon2 = "0.5.3"
aes-gcm = "0.10.3"
rand = "0.9.5"
dirs = "7.0.0"
russh-sftp = "3.0.0"
portable-pty = "0.9.0"
# 恢复密钥（`recovery.rs`）：把库密钥封给一把 SSH 公钥，忘主密码时用私钥开封。
# Ed25519 → X25519 的 ECDH + HKDF + AES-GCM。这三个都是**russh 已有的传递依赖**
# （都已在 Cargo.lock 里），提成直接依赖不用新增任何下载。
# SSH 密钥的解析直接走 russh 的 re-export（`russh::keys::ssh_key`），不单独声明
# ssh-key —— 那份被 russh 钉死在 `=0.7.0-rc.11`，自己写一个范围会解析出第二个副本。
curve25519-dalek = "5"
sha2 = "0.10"
hkdf = "0.12"

[dev-dependencies]
# russh 0.63 依赖 rand 0.10，而主代码用的是 0.9，两边 semver 不兼容只能并存。
# 测试里生成临时 host key 需要它，所以单独引一份并改名
rand10 = { package = "rand", version = "0.10", features = ["thread_rng"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
